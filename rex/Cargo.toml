[package]
name = "rex"
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
rex-ast = { path = "../rex-ast", version = "4.0.0" }
rex-engine = { path = "../rex-engine", version = "4.0.0" }
rex-parser = { path = "../rex-parser", version = "4.0.0" }
rex-proc-macro = { path = "../rex-proc-macro", version = "4.0.0" }
rex-typesystem = { path = "../rex-typesystem", version = "4.0.0" }
rex-util = { path = "../rex-util", version = "4.0.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[lints]
workspace = true
