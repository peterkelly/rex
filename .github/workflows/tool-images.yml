name: Tool images

on:
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: Run native Docker smoke and Rust integration tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native-build-and-test:
    name: Native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      REX_WORKFLOW_DOCKER_TESTS: >-
        ${{ ((github.event_name == 'workflow_dispatch' &&
        inputs.run_integration_tests) ||
        vars.REX_WORKFLOW_DOCKER_TESTS == '1') && '1' || '0' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load native images
        working-directory: rex-workflow/tool-images
        run: docker buildx bake --set '*.platform=${{ matrix.platform }}' --load

      - name: Run hardened smoke tests
        if: env.REX_WORKFLOW_DOCKER_TESTS == '1'
        working-directory: rex-workflow/tool-images
        run: ./verify.sh

      - name: Install Rust toolchain
        if: env.REX_WORKFLOW_DOCKER_TESTS == '1'
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust build
        if: env.REX_WORKFLOW_DOCKER_TESTS == '1'
        uses: Swatinem/rust-cache@v2

      - name: Run Docker integration tests
        if: env.REX_WORKFLOW_DOCKER_TESTS == '1'
        run: cargo test -p rex-workflow --test docker_tools -- --nocapture --test-threads=1
