name: Tool images

on:
  pull_request:
    paths:
      - "rex-workflow/tool-images/**"
      - ".github/workflows/tool-images.yml"
  push:
    branches: ["main"]
    paths:
      - "rex-workflow/tool-images/**"
      - ".github/workflows/tool-images.yml"
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: Build native images and run Docker integration tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      REX_WORKFLOW_DOCKER_TESTS: >-
        ${{ ((github.event_name == 'workflow_dispatch' &&
        inputs.run_integration_tests) ||
        vars.REX_WORKFLOW_DOCKER_TESTS == '1') && '1' || '0' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 and arm64 images
        working-directory: rex-workflow/tool-images
        run: docker buildx bake --set '*.platform=linux/amd64,linux/arm64'

      - name: Load native images
        if: env.REX_WORKFLOW_DOCKER_TESTS == '1'
        working-directory: rex-workflow/tool-images
        run: docker buildx bake --load

      - name: Run hardened smoke tests
        if: env.REX_WORKFLOW_DOCKER_TESTS == '1'
        working-directory: rex-workflow/tool-images
        run: ./verify.sh

      - name: Install Rust toolchain
        if: env.REX_WORKFLOW_DOCKER_TESTS == '1'
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust build
        if: env.REX_WORKFLOW_DOCKER_TESTS == '1'
        uses: Swatinem/rust-cache@v2

      - name: Run Docker integration tests
        if: env.REX_WORKFLOW_DOCKER_TESTS == '1'
        run: cargo test -p rex-workflow --test docker_tools -- --nocapture
