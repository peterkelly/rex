[workspace]
resolver = "2"
members = [
    "rex",
    "rex-ast",
    "rex-cli",
    "rex-engine",
    "rex-fuzz",
    "rex-lsp",
    "rex-mdbook",
    "rex-parser",
    "rex-proc-macro",
    "tools/rex-tool-ffmpeg",
    "tools/rex-tool-gnuplot",
    "tools/rex-tool-graphviz",
    "tools/rex-tool-imagemagick",
    "tools/rex-tool-poppler",
    "tools/rex-tool-qpdf",
    "tools/rex-tools-integration",
    "rex-typesystem",
    "rex-util",
    "rex-wasm",
]

[workspace.package]
description = "Rex: A strongly-typed, pure, implicitly parallel functional programming language"
edition = "2024"
homepage = "https://rexlang.ai"
license = "MIT"
readme = "README.md"
repository = "https://github.com/peterkelly/rex"
version = "3.9.14"

[workspace.dependencies]
# External dependencies
anyhow = "1"
async-trait = "0.1"
blake3 = { version = "1" }
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
object_store = "0.14"
nix = "0.31"
proc-macro2 = "1"
quote = "1"
rand = "0.10"
regex = "1"
rpds = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static_assertions = "1"
syn = { version = "2", features = ["full"] }
thiserror = "1"
tokio = "1"
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "js"] }

# Internal dependencies
rex-ast = { path = "rex-ast" }
rex-engine = { path = "rex-engine" }
rex-parser = { path = "rex-parser" }
rex-proc-macro = { path = "rex-proc-macro" }
rex-typesystem = { path = "rex-typesystem" }
rex-util = { path = "rex-util" }

[workspace.lints.clippy]
uninlined_format_args = "allow"
